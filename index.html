<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#080808"><title>Stitchell Glass</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f6e7bc;background:#080808}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}.app{width:min(100%,600px);min-height:min(100vh,600px);padding:22px 24px;display:flex;flex-direction:column}header{text-align:center;border-bottom:1px solid #6d5423;padding-bottom:12px}h1{font-size:29px;letter-spacing:.12em;margin:0;color:#f5d37c}.subtitle{font-size:12px;color:#b5a275;letter-spacing:.15em;margin-top:3px}.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#d9c79e;margin-top:10px}.screen{flex:1}h2{font-size:19px;letter-spacing:.07em;color:#e9c774;margin:16px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{background:linear-gradient(145deg,#292113,#14120f);border:1.5px solid #a88a46;border-radius:15px;color:#f3dfae;min-height:92px;padding:12px;font-size:17px;font-weight:650;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:10px}.tile .small{font-size:11px;color:#bcae8b;font-weight:400}.tile:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:2px}.tile.on{background:linear-gradient(145deg,#59401a,#282014);border-color:#f5ca5c;box-shadow:inset 0 0 0 1px #8b6825}.switch{align-self:flex-end;width:43px;height:24px;border-radius:14px;background:#555;position:relative;border:1px solid #aaa}.switch:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#ddd}.on .switch{background:#c79b38}.on .switch:after{left:22px;background:#fff4ce}.back{border:1px solid #b49550;border-radius:11px;background:#19150e;color:#f0d28b;padding:11px 18px;font-weight:700;margin-top:15px;cursor:pointer}.status{color:#b7a87f;font-size:11px;text-align:center;margin-top:12px}.hidden{display:none!important}.wide{grid-column:span 2}.notice{font-size:13px;color:#e9d49b;background:#241c11;border:1px solid #856b37;border-radius:10px;padding:11px;margin:12px 0}.footer{font-size:11px;color:#978660;text-align:center;padding-top:12px}
</style></head><body><main class="app"><header><h1>STITCHELL GLASS</h1><div class="subtitle">SMART HOME CONTROL</div><div class="meta"><span id="clock">--:--</span><span id="date">--</span><span>◆ HOME</span></div></header><div class="screen"><h2 id="heading">Home</h2><div id="notice" class="notice">DESIGN PREVIEW · Home Assistant control is not connected on this page yet.</div><section id="grid" class="grid"></section></div><button id="back" class="back hidden" type="button">← BACK</button><div class="footer" id="status" aria-live="polite">Stitchell Glass · Gold Edition</div></main>
<script>
const pages={
home:[['Living Room','living','◈ Lights & TV'],['Kitchen','kitchen','◈ Kitchen & island'],['Dining','dining','◈ Dining & island'],['Master','master','◈ Bedroom & closet'],['Outdoors','outdoors','◈ Patio & garage'],['Scenes','scenes','◈ Party & movie'],['TV','tv','◈ Entertainment'],['Music','music','◈ Whole home']],
living:[['Living Room Lights',null,'light.living_room'],['TV Lights',null,'light.tv_lights'],['Light Bars',null,'light.light_bars'],['Spotlights',null,'light.rgbic_spotlights'],['Fireplace',null,'light.fireplace_drawer'],['Living Room TV','tv','Power & apps']],
kitchen:[['Kitchen Lights',null,'light.stitchell_kitchen_lights'],['Island Lights',null,'light.stitchell_island_lights']],
dining:[['Island Lights',null,'light.stitchell_island_lights'],['Dining Room',null,'Dining light group · setup needed']],
master:[['Bedroom Lights',null,'light.stitchell_master_bedroom_lights'],['Bathroom Lights',null,'light.stitchell_master_bathroom_lights'],['Closet Lights',null,'light.stitchell_master_closet_lights'],['Bedroom TV','tv','Power & apps']],
outdoors:[['Front Lights',null,'light.stitchell_front_outdoor_lights'],['Back Lights',null,'light.stitchell_back_outdoor_lights'],['Garage Lights',null,'light.stitchell_garage_lights'],['Front Patio 1',null,'light.front_patio_1'],['Front Patio 2',null,'light.front_patio_2'],['Front Patio 3',null,'light.front_patio_3']],
scenes:[['Movie Mode',null,'script.stitchell_movie_mode'],['Spooky Start',null,'script.stitchell_spooky_loop'],['Spooky Stop',null,'script.stitchell_spooky_stop'],['Party Mode',null,'Custom scene · setup needed'],['Relax',null,'Custom scene · setup needed']],
tv:[['Living Room TV',null,'media_player.lg_webos_tv_oled65c1pub_2'],['Master TV',null,'media_player.lg_webos_tv_55qned80uqa'],['Netflix',null,'App shortcut · setup needed'],['Paramount+',null,'App shortcut · setup needed'],['Volume +',null,'TV command · setup needed'],['Volume −',null,'TV command · setup needed']],
music:[['Spotify',null,'media_player.spotify_matt'],['Whole House',null,'media_player.whole_house'],['Master Speaker',null,'media_player.master_bedroom_speaker']]};
let page='home';const stack=[];const grid=document.getElementById('grid');function show(next){page=next;document.getElementById('heading').textContent=next==='home'?'Home':({living:'Living Room',master:'Master Bedroom',scenes:'Scenes & Modes',tv:'TV & Streaming',music:'Music',outdoors:'Outdoor Lights',dining:'Dining Room'}[next]||next[0].toUpperCase()+next.slice(1));grid.replaceChildren();pages[next].forEach(([name,dest,detail])=>{const b=document.createElement('button');b.className='tile';b.type='button';const label=document.createElement('span');label.textContent=name;const sub=document.createElement('span');sub.className='small';sub.textContent=detail;b.append(label,sub);if(!dest&&detail.startsWith('light.')){const sw=document.createElement('span');sw.className='switch';sw.setAttribute('aria-hidden','true');b.append(sw)}b.addEventListener('click',()=>{if(dest){stack.push(page);show(dest)}else{document.getElementById('status').textContent=name+' · Preview only; no command sent';}});grid.append(b)});document.getElementById('back').classList.toggle('hidden',next==='home');document.getElementById('status').textContent='Stitchell Glass · Gold Edition'}document.getElementById('back').addEventListener('click',()=>show(stack.pop()||'home'));function tick(){const now=new Date();document.getElementById('clock').textContent=now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});document.getElementById('date').textContent=now.toLocaleDateString([],{month:'short',day:'numeric'})}tick();setInterval(tick,30000);show('home');
</script></body></html>
