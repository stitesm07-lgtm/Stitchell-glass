<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#090909"><title>Stitchell Glass</title><style>
:root{font-family:system-ui,sans-serif;color:#f4e6bb;background:#090909}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}.app{width:min(100%,600px);padding:24px;text-align:center}h1{font-size:clamp(23px,6vw,36px);letter-spacing:.09em;margin:0 0 5px}p{color:#b8a77d;margin:0 0 22px;font-size:14px}.grid{display:grid;gap:14px}button{width:100%;min-height:76px;border:2px solid #cba84b;border-radius:18px;background:#201a0f;color:#ffe5a0;font-size:25px;font-weight:700;cursor:pointer}button:focus-visible{outline:4px solid #fff;outline-offset:3px}.back{font-size:18px;min-height:55px;margin-top:16px;background:#151515}.hidden{display:none}.status{font-size:13px;margin-top:18px;color:#a9a9a9}</style></head>
<body><main class="app"><h1>STITCHELL GLASS</h1><p>Home control · Display prototype</p><section id="home" class="grid"><button data-page="lights">LIGHTS</button><button data-page="modes">MODES</button><button data-page="tv">TV</button></section><section id="lights" class="grid hidden"><button data-page="living">Living Room</button><button>Kitchen</button><button>Dining / Island</button></section><section id="living" class="grid hidden"><button id="living-on" type="button">ON</button><button id="living-off" type="button">OFF</button><div class="status" id="living-status" aria-live="polite">Preview only · Home Assistant not connected</div></section><section id="modes" class="grid hidden"><button>Party Mode</button><button>Movie Mode</button><button>Relax</button></section><section id="tv" class="grid hidden"><button>Living Room TV</button><button>Volume</button><button>Streaming</button></section><button id="back" class="back hidden">← BACK</button><div class="status">Preview only · controls not connected yet</div></main><script>const pages=['home','lights','living','modes','tv'];let currentPage='home';function show(page){currentPage=page;pages.forEach(p=>document.getElementById(p).classList.toggle('hidden',p!==page));document.getElementById('back').classList.toggle('hidden',page==='home')}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.page)));document.getElementById('back').addEventListener('click',()=>show(currentPage==='living'?'lights':'home'));['on','off'].forEach(action=>document.getElementById('living-'+action).addEventListener('click',()=>{document.getElementById('living-status').textContent='Preview: '+action.toUpperCase()+' selected · No device command sent';}));</script></body></html>
